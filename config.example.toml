[server]
listen_addr = ":8080"
read_timeout = "30s"
write_timeout = "60s"
context_sign_key = "replace-with-at-least-32-byte-hmac-secret-key"
context_ttl = "24h"

[database]
dsn = "postgres://postgres:postgres@localhost:5432/ai_memory?sslmode=disable"
max_conns = 20
min_conns = 2
max_conn_lifetime = "30m"
lock_timeout = "3s"
auto_migrate = true

[auth]
enable_mtls_headers = false
enable_oidc_headers = false
cookie_secure = false

[limits]
max_title_bytes = 256
max_content_bytes = 65536
max_tags = 20
max_tag_bytes = 64
max_source_refs = 20
max_query_limit = 100
default_query_limit = 20
write_rate_per_minute = 120
write_burst = 30
idempotency_ttl = "72h"

[export]
enabled = false
output_dir = "./export"
interval = "5m"
git_commit = false

[log]
level = "info"
